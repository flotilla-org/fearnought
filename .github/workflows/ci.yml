name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The client has Unix-socket and named-pipe paths.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # The workspace arrives with flotilla-org/wheelhouse#782; until then these steps skip.
      - name: Install the pinned toolchain
        if: hashFiles('Cargo.toml') != ''
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        if: hashFiles('Cargo.toml') != '' && runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        if: hashFiles('Cargo.toml') != ''
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        if: hashFiles('Cargo.toml') != ''
        run: cargo test --workspace --locked

  feeders:
    name: Feeders
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash ci/test-feeders.sh
